<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="jam">
  <!-- The jam mark reduced to three bars (ink · amber · ink) on a rounded ink
       tile, so it holds up at 16px on any browser theme. The header logo
       (app/src/JamMark.tsx) is the fuller five-bar version. -->
  <rect width="100" height="100" rx="22" fill="#202427"/>
  <rect x="24" y="50" width="13" height="30" rx="6.5" fill="#e8ebee"/>
  <rect x="44" y="28" width="13" height="52" rx="6.5" fill="#d97706"/>
  <rect x="64" y="44" width="13" height="36" rx="6.5" fill="#e8ebee"/>
</svg>
